<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="stylesheet" href="style.css"/>
  <title>Calculator</title>
</head>
<body>
  <div class="outerContainer">
    <div class="screen">
      <h1 id="display">0</h1>
    </div>
    
    <div class="clearDeletecontainer">
      <div class="clearbtn" id="clearbtn">CLEAR</div>
      <div class="clearbtn" id="deletbtn">DEL</div>
    </div>
    
    <ul class="numbercontainer">
      <li value="7">7</li>
      <li value="8">8</li>
      <li value="9">9</li>
      <li class="defcolor" value="÷">÷</li>
      
      <li value="4">4</li>
      <li value="5">5</li>
      <li value="6">6</li>
      <li class="defcolor" value="*">×</li>
      
      <li value="1">1</li>
      <li value="2">2</li>
      <li value="3">3</li>
      <li class="defcolor" value="-">−</li>
      
      <li value="0">0</li>
      <li value=".">.</li>
      <li value="%">%</li>
      <li class="defcolor" value="+">+</li>
      
      <li class="equlto" value="=">=</li>
    </ul>
  </div>
  <script src="app.js"></script>
</body>
</html>
